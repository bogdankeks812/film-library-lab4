spring.application.name=film-library

# База данных MySQL (запускается в Docker-контейнере).
# При запуске через docker compose адрес заменяется переменными окружения.
spring.datasource.url=jdbc:mysql://localhost:3306/filmlibrary?allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=filmuser
spring.datasource.password=filmpass

# Структурой базы теперь управляет Flyway, Hibernate таблицы не создаёт
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Flyway: при запуске приложения выполняет новые скрипты из db/migration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
